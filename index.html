<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The Lewis Ledger. See if monthly soft spending is on pace.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lewis Ledger">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>The Lewis Ledger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="apple-touch-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="banner" class="banner" hidden>SAMPLE DATA, preview only</div>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg class="logo" viewBox="0 0 72 72" width="52" height="52" aria-hidden="true">
          <circle cx="36" cy="36" r="31.5" fill="none" stroke="currentColor" stroke-width="3.6"/>
          <circle class="logo-inner" cx="36" cy="36" r="24.2" fill="none" stroke-width="1.7"/>
          <text x="36" y="36.2" text-anchor="middle" dominant-baseline="central" fill="currentColor" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-weight="700" font-size="32">L</text>
        </svg>
        <div class="brand-text">
          <h1>The Lewis Ledger</h1>
          <p class="subtitle">Soft Money<span id="month"></span></p>
        </div>
      </div>
      <p id="updated" class="updated"></p>
      <div class="rules" aria-hidden="true"><span></span><span></span></div>
    </header>

    <p id="status" class="status" role="status">Loading…</p>
    <p id="tip" class="tip" hidden></p>
    <button id="retry" type="button" hidden>Try again</button>
    <p id="notice" class="notice" hidden></p>

    <section id="hero" class="panel" hidden>
      <div class="bar-block">
        <p class="kicker">Spending</p>
        <p id="spend-label" class="bar-label"></p>
        <div class="track-wrap">
          <div id="spend-track" class="track" role="img"></div>
          <div id="spend-marker" class="marker" hidden></div>
        </div>
      </div>
      <div class="bar-block">
        <p class="kicker">Month</p>
        <p id="month-label" class="bar-label"></p>
        <div class="track-wrap">
          <div id="month-track" class="track" role="img"></div>
        </div>
      </div>
      <p class="hint">The line on spending is where today falls in the month.</p>
    </section>

    <section id="cards" class="cards" aria-label="Categories"></section>

    <footer>
      <div class="rules" aria-hidden="true"><span></span><span></span></div>
      <p class="tagline">Every dollar has a job.</p>
      <p class="fine">Pocket money not included</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
